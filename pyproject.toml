[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-gap-gain"
version = "0.1.0"
description = "Reference implementation of Depth-Gap Gain (DGG) for bounded-depth TTS adaptation diagnostics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
training = ["torch>=2.4", "peft>=0.10"]
test = ["pytest>=8.0", "matplotlib>=3.7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
